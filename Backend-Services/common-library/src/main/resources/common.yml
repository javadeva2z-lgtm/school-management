spring:
  profiles:
    default: dev
  jpa:
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  tenant:
    default-schema: ${DB_DEFAULT_SCHEMA:school_management}
  open-endpoints:
    - /ui/**
    - /user-service/api/v1/auth/login/**
    - /user-service/api/v1/users/register/admin/**
    - /user-service/api/v1/schools/public/**
    - /user-service/api/test/**
    - /api/v1/users/register/admin/**
    - /api/v1/schools/public/**
    - /api/v1/auth/login/**
    - /api/test/**
    - /internal/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /swagger-ui/index.html
    - /webjars/**
    - /swagger-resources/**
    - /configuration/**
    - /error
    - /favicon.ico
    - /static/ui/**
