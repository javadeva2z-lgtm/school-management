spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${PROD_JPA_DDL_AUTO:validate}
    show-sql: ${PROD_JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${PROD_EUREKA_URL}

app:
  base-url: ${PROD_APP_BASE_URL}
  jwt-secret-key: ${PROD_JWT_SECRET_KEY}
  corsallowed: ${PROD_CORS_ALLOWED_ORIGINS}
  jwt-expiration-ms: ${PROD_JWT_EXPIRATION_MS:3600000}