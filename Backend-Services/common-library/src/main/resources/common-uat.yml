spring:
  config:
    activate:
      on-profile: uat
  datasource:
    url: ${UAT_DB_URL}
    username: ${UAT_DB_USERNAME}
    password: ${UAT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${UAT_JPA_DDL_AUTO:validate}
    show-sql: ${UAT_JPA_SHOW_SQL:false}

eureka:
  client:
    service-url:
      defaultZone: ${UAT_EUREKA_URL}

app:
  base-url: ${UAT_APP_BASE_URL}
  jwt-secret-key: ${UAT_JWT_SECRET_KEY}
  corsallowed: ${UAT_CORS_ALLOWED_ORIGINS}
  jwt-expiration-ms: ${UAT_JWT_EXPIRATION_MS:3600000}