server:
  port: ${PAYMENT_SERVICE_PORT:8003}

payment:
  gateways:
    mode: ${PAYMENT_GATEWAY_MODE:test}
    user-service-base-url: ${USER_SERVICE_BASE_URL:http://localhost:8000/user-service}
    public-base-url: ${PAYMENT_PUBLIC_BASE_URL:}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    payu:
      key: ${PAYU_KEY:}
      salt: ${PAYU_SALT:}

spring:
  config:
    import: optional:classpath:/common-dev.yml,optional:classpath:/common-uat.yml,optional:classpath:/common-prod.yml,classpath:/common.yml
  application:
    name: payment-service
  payment:
    reminder:
      days-before-due: ${PAYMENT_REMINDER_DAYS_BEFORE_DUE:3}
      days-after-due: ${PAYMENT_REMINDER_DAYS_AFTER_DUE:7}
      days-after-due-14: ${PAYMENT_REMINDER_DAYS_AFTER_DUE_14:14}
